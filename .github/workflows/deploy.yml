name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      run_terraform:
        description: Apply Terraform changes to the App spec (skip for routine deploys — most deploys should)
        type: boolean
        default: false

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false # never cancel a half-applied deploy/destroy

env:
  TF_VERSION: 1.14.0 # matches the locally-installed CLI used to author infra/
  # deploy/smoke need APP_ID/DEFAULT_INGRESS/LIVE_URL but must NOT reference
  # a protected Environment (that's what collapses the approval gate down to
  # the single one on terraform-apply, below) -- so these live as plain
  # repo-level vars (STAGING_*/PRODUCTION_*), selected here once by
  # `inputs.environment` rather than duplicated in every job/step.
  DEPLOY_APP_ID: ${{ inputs.environment == 'production' && vars.PRODUCTION_APP_ID || vars.STAGING_APP_ID }}
  DEPLOY_DEFAULT_INGRESS: ${{ inputs.environment == 'production' && vars.PRODUCTION_DEFAULT_INGRESS || vars.STAGING_DEFAULT_INGRESS }}
  DEPLOY_LIVE_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_LIVE_URL || vars.STAGING_LIVE_URL }}

jobs:
  # Deliberately first in the graph, no `needs` (Vansh, 2026-07-30) — CI runs
  # before the branch<->environment guard rather than after it. Trade-off:
  # a wrong environment/branch pairing now costs a full CI run instead of
  # failing in seconds, but every dispatch gets a CI signal up front,
  # matching PR-creation CI's own priority.
  ci:
    uses: ./.github/workflows/ci.yml

  # No `ref` input by design (D5) — the branch is whichever one you dispatch
  # from (github.ref_name). production still only deploys from `main`;
  # staging deploys from any branch (Vansh, 2026-09-18) -- GitHub's own
  # deployment-branch-policy on the `staging`/`staging-plan` Environments was
  # widened to `*` to match, since that policy is enforced independently of
  # this check.
  guard:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Verify branch matches environment
        run: |
          if [ "${{ inputs.environment }}" = production ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::environment=production deploys only from 'main' (got '$GITHUB_REF_NAME')"
            exit 1
          fi

      - name: Resolve dispatched commit
        id: resolve
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  terraform-plan:
    needs: guard
    if: ${{ inputs.run_terraform }}
    runs-on: ubuntu-latest
    # Ungated per-environment Environment, reviewable before approval since
    # the plan itself isn't gated — the branch restriction on this
    # Environment is still enforced, only the reviewer requirement isn't.
    environment:
      name: ${{ inputs.environment }}-plan
    defaults:
      run:
        working-directory: infra
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend-config=env/${{ inputs.environment }}.backend.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -var-file=env/${{ inputs.environment }}.tfvars -out=tfplan

      - name: Write plan to job summary
        run: |
          {
            echo "### Terraform plan — ${{ inputs.environment }}"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/tfplan
          retention-days: 7

  terraform-apply:
    needs: terraform-plan
    if: ${{ inputs.run_terraform }}
    runs-on: ubuntu-latest
    # The ONLY job that references the protected Environment (Vansh,
    # 2026-09-18 — previously deploy and smoke each carried their own
    # separate reference too, which meant 3 required-reviewer prompts on a
    # full run_terraform:true deploy, 2 on a routine run_terraform:false one;
    # deploy/smoke now read their DO vars from repo-level DEPLOY_* instead).
    # This is what makes the required-reviewer and deployment-branch-policy
    # rules fire (D5/V7) — single gate, right before the infra change itself.
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra

      - name: Init
        run: terraform init -backend-config=env/${{ inputs.environment }}.backend.hcl

      - name: Apply saved plan
        run: terraform apply tfplan

      # On a first-ever apply for this environment, the `deploy` job below
      # WILL fail (env.DEPLOY_APP_ID is still empty — doctl apps
      # create-deployment "" -> DO 405, confirmed 2026-07-30). Not a bug:
      # copy the values below into the repo-level APP_ID/LIVE_URL/
      # DEFAULT_INGRESS variables, then re-run failed jobs (retries only
      # deploy/smoke, not Terraform). See plan doc R8.
      - name: Summarize App outputs
        run: |
          {
            echo "### Terraform outputs — ${{ inputs.environment }}"
            echo "- app_id: \`$(terraform output -raw app_id)\`"
            echo "- live_url: \`$(terraform output -raw live_url)\`"
            echo "- default_ingress: \`$(terraform output -raw default_ingress)\`"
            echo ""
            echo "If this is the first apply for this environment, or the App was recreated, copy these into the repo-level \`${{ inputs.environment == 'production' && 'PRODUCTION' || 'STAGING' }}_APP_ID\` / \`..._LIVE_URL\` / \`..._DEFAULT_INGRESS\` **variables** (not secrets — not sensitive; read by \`deploy\`/\`smoke\` via this workflow's top-level \`env:\`) before the next deploy. \`smoke\` checks \`DEFAULT_INGRESS\` (App Platform's own \`*.ondigitalocean.app\` hostname), not \`LIVE_URL\` — \`LIVE_URL\` becomes the custom domain once DNS/cert are live (Group D), which isn't true immediately after a first apply. On a first apply, the \`deploy\` job in **this same run** will already have failed with an empty app ID — set the variables now, then use **Re-run jobs → Re-run failed jobs**."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [ci, terraform-apply]
    runs-on: ubuntu-latest
    # `always()` is load-bearing: without it, GitHub implicitly ANDs in
    # `success()` across the whole expression, which would block this job
    # whenever terraform-apply is skipped — i.e. every routine
    # run_terraform: false deploy, since a skipped job's result is
    # 'skipped', not 'success'.
    if: ${{ always() && needs.ci.result == 'success' && (inputs.run_terraform == false || needs.terraform-apply.result == 'success') }}
    # No `environment:` here on purpose (Vansh, 2026-09-18) — the single
    # required-reviewer gate lives on terraform-apply only. APP_ID (an App
    # Platform app ID isn't a credential, hence a variable not a secret)
    # comes from the repo-level env.DEPLOY_APP_ID above; DO_TOKEN is already
    # a repo-level secret, needing no Environment reference either.
    outputs:
      deployment_id: ${{ steps.create.outputs.deployment_id }}
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Create deployment
        id: create
        run: |
          id=$(doctl apps create-deployment "${{ env.DEPLOY_APP_ID }}" --wait --format ID --no-header)
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    # `always()` is load-bearing here too, same reasoning as `deploy`'s own
    # comment below: GitHub's implicit default `if` for a job with `needs`
    # checks the *entire* upstream chain, not just direct needs — so without
    # this, smoke gets skipped whenever terraform-plan/terraform-apply are
    # skipped (every routine run_terraform: false deploy), even though guard
    # and deploy both actually succeeded. Confirmed 2026-07-30 — smoke was
    # silently skipped on a real run_terraform: false deploy before this fix.
    if: ${{ always() && needs.guard.result == 'success' && needs.deploy.result == 'success' }}
    # No `environment:` here either (Vansh, 2026-09-18), same reasoning as
    # `deploy` above — DEFAULT_INGRESS/APP_ID/LIVE_URL come from the
    # repo-level env.DEPLOY_* vars, not an Environment reference, so this job
    # no longer re-triggers its own required-reviewer prompt.
    #
    # Checks DEFAULT_INGRESS (App Platform's own *.ondigitalocean.app
    # hostname), not LIVE_URL — LIVE_URL becomes the custom domain once
    # DNS/cert are live (Group D), which isn't guaranteed right after an
    # apply. Confirmed 2026-07-30: checking LIVE_URL before DNS exists just
    # fails on an unresolvable/uncertified custom domain, not a real signal.
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: GET / is 200
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "${{ env.DEPLOY_DEFAULT_INGRESS }}/")
          [ "$status" = "200" ] || { echo "::error::GET / returned $status"; exit 1; }

      - name: Deep link falls back to the SPA shell (proves catchall_document)
        run: |
          status=$(curl -s -o /tmp/deep.html -w '%{http_code}' "${{ env.DEPLOY_DEFAULT_INGRESS }}/this/route/does/not/exist")
          [ "$status" = "200" ] || { echo "::error::deep route returned $status instead of 200"; exit 1; }
          grep -q '<div id="root"' /tmp/deep.html || { echo "::error::deep route did not return the SPA shell"; exit 1; }

      - name: A hashed asset resolves
        run: |
          curl -s "${{ env.DEPLOY_DEFAULT_INGRESS }}/" -o /tmp/index.html
          asset=$(grep -oE '/assets/[^"]+\.(js|css)' /tmp/index.html | head -n1)
          [ -n "$asset" ] || { echo "::error::no /assets/* reference found in index.html"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' "${{ env.DEPLOY_DEFAULT_INGRESS }}${asset}")
          [ "$status" = "200" ] || { echo "::error::asset $asset returned $status"; exit 1; }

      # Best-effort, not a hard gate (continue-on-error): before Group D's DNS
      # exists for a fresh environment, LIVE_URL is expected to fail — that's
      # not a real regression, DEFAULT_INGRESS above already proved the app
      # itself works. Once DNS/cert are live (confirmed for staging
      # 2026-07-30), this is what actually validates the real user-facing
      # domain, which DEFAULT_INGRESS alone never touches.
      - name: LIVE_URL (custom domain) is 200, if DNS/cert are live yet
        continue-on-error: true
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "${{ env.DEPLOY_LIVE_URL }}/")
          if [ "$status" = "200" ]; then
            echo "LIVE_URL is live and serving (200)."
          else
            echo "::warning::LIVE_URL (${{ env.DEPLOY_LIVE_URL }}) returned $status — expected if DNS/cert for this environment aren't set up yet (Group D). Not blocking."
          fi

      - name: Deployed commit matches the dispatched sha
        run: |
          # `doctl ... -o json` wraps single-resource `get` output in a JSON
          # array too — confirmed 2026-07-30 (root-level `.static_sites`
          # failed with "Cannot index array with string"; fixed with `.[0]`).
          # `.[0].static_sites[0].source_commit_hash` itself is now confirmed
          # correct against a real deployment response (same run). `.services`
          # fallback kept defensively — not applicable to this static-site
          # app, only relevant if a service component is ever added.
          raw=$(doctl apps get-deployment "${{ env.DEPLOY_APP_ID }}" "${{ needs.deploy.outputs.deployment_id }}" -o json)
          deployed_sha=$(echo "$raw" | jq -r '.[0].static_sites[0].source_commit_hash // .[0].services[0].source_commit_hash // empty')
          expected_sha="${{ needs.guard.outputs.sha }}"
          if [ "$deployed_sha" != "$expected_sha" ]; then
            echo "::error::deployed commit $deployed_sha does not match dispatched sha $expected_sha"
            echo "::group::Raw doctl response"
            echo "$raw" | jq .
            echo "::endgroup::"
            exit 1
          fi
