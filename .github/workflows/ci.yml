name: CI

on:
  pull_request:
    branches: [main, staging]
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        # Capped to 2 workers: GitHub's shared ubuntu-latest runners don't have
        # enough CPU for vitest's default (one worker per core) when several
        # tests mount heavy component trees (e.g. NewDealWizard's full
        # MvpAppShell) — that contention was pushing waitFor/findBy calls past
        # their timeout under the default worker count, causing flaky
        # (non-deterministic, count varies run to run) failures unrelated to
        # any real regression. See vitest.setup.ts/vitest.config.ts for the
        # matching timeout/retry headroom already in place for this.
        run: pnpm exec vitest run --minWorkers=1 --maxWorkers=2

      - name: Build
        run: pnpm build
        env:
          # Build-time only; a placeholder key keeps the bundle compilable.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

  # Playwright against the staging DO App (playbook FE-5 step 4). Enable by
  # setting the E2E_ENABLED repository variable to "true" once the FastAPI
  # staging App exists; until then the job is skipped.
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    if: vars.E2E_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright
        run: pnpm exec playwright test
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
          # Clerk test-instance keys for testing tokens (e2e/global.setup.ts)
          CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
